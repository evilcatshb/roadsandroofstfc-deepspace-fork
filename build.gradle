// Only edit below this line, the above code adds and enables the necessary things for Forge to be setup.
plugins {
    id 'java'
    id 'idea'
    id "com.matthewprenger.cursegradle" version "1.4.0"
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'org.spongepowered.mixin' version '0.7.+'
}

base {
    version = mod_version
    group = mod_group_id
    archivesName = mod_id
}

// Mojang ships Java 17 to end users in 1.18+, so your mod should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

idea {
    module {
        excludeDirs.add(file("run"))
    }
}

repositories {
    maven { url 'https://www.cursemaven.com'; content { includeGroup "curse.maven" } }
    maven { name = "BlameJared"; url = "https://maven.blamejared.com" }
    maven { name = "Terraformers"; url = "https://maven.terraformersmc.com/releases" }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor("org.spongepowered:mixin:${mixin_version}:processor")
    compileOnly(fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}"))
    compileOnly(fg.deobf("dev.emi:emi-forge:1.1.24+1.20.1"))
    compileOnly(fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"))
    runtimeOnly(fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}"))
    compileOnly(fg.deobf("curse.maven:jade-324717:${jade_version}"))
    runtimeOnly(fg.deobf("curse.maven:jade-324717:${jade_version}"))
}

processResources {
    duplicatesStrategy(DuplicatesStrategy.EXCLUDE)
}

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    mappings channel: mapping_channel, version: mapping_version

    runs {
        all {
//            arg "-mixin.config=rnr.mixins.json"

            property 'forge.logging.console.level', 'debug'

//            property 'mixin.env.remapRefMap', 'true'
//            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                rnr {
                    source sourceSets.main
                }
            }
        }

        client {
            workingDirectory project.file('run/client')
        }

        server {
            workingDirectory project.file('run/server')

            arg("--nogui")
        }
    }
}

//mixin {
//    // MixinGradle Settings
////    add sourceSets.main, 'rnr.refmap.json'
//    //If you get duplicate refmap error, delete the existing refmap file, a new one should generate on build.
//}

// Example for how to get properties into the manifest for reading at runtime.
tasks {
    jar {
        manifest {
            attributes([
                    "Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1", // We are version 1 of ourselves
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
                    // "MixinConfigs":"rnr.mixins.json"
            ])
        }
    }
}
